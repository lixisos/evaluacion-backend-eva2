<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Operadores - BuildCorp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow p-4" style="width: 380px;">
        <h4 class="text-center fw-bold mb-3">🏗️ BuildCorp Login</h4>
        {% if error %}
            <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login/">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold">Usuario</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold">Ingresar al Sistema</button>
            <a href="/" class="btn btn-link w-100 mt-2 btn-sm text-secondary">Volver al Panel Principal</a>
        </form>
    </div>
</body>
</html>
